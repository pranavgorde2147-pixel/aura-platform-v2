services:
  aura-server3:
    build:
      context: .
    container_name: aura-server3
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8002:8002"
    volumes:
      - storage_data:/data
    networks:
      - aura-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  storage_data:
    driver: local

networks:
  aura-network:
    external: true
    name: aura-network
